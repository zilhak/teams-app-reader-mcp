[package]
name = "teams-core"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Teams v2 로컬 IndexedDB(LevelDB) 읽기 + V8 디코드 + Teams 스키마 매핑 (transport/MCP 무관)"

[dependencies]
snap = "1"
thiserror = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# fetch_image: 쿠키 DB 읽기 + AMS 이미지 GET (이 모듈만 네트워크 사용).
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
# clipboard: HTML flavor 복사. image-data 기본 feature 는 `image` 크레이트를 끌어오므로 끈다.
arboard = { version = "3", default-features = false }

# 쿠키 복호화 (macOS·Linux): 키체인/키링 키 → PBKDF2-SHA1 → AES-128-CBC.
# (반복 횟수만 다르다: macOS 1003, Linux 1.)
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
hmac = "0.12"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

# 쿠키 복호화 (Windows): Local State DPAPI 키 → AES-256-GCM.
[target.'cfg(target_os = "windows")'.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }

[[example]]
name = "explore"
